<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Freaks n Cars BBQ Quiz</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: #000;
            padding: 24px;
        }

        .start-link {
            display: block;
            width: min(80vw, 700px);
            text-decoration: none;
        }

        .logo {
            display: block;
            width: 100%;
            height: auto;
            border-radius: 20px;
            cursor: pointer;
            animation: pulse 2.2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
                opacity: 1;
            }
            50% {
                transform: scale(1.04);
                opacity: 0.96;
            }
        }
    </style>
</head>
<body>
    <a href="quiz.html" class="start-link" aria-label="Quiz starten">
        <img src="Assets/logo.jpg" alt="Freaks n Cars BBQ Quiz Logo" class="logo" />
    </a>
</body>
</html>
